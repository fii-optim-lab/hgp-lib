[project]
name = "hgp-lib"
version = "1.0.1"
requires-python = ">=3.10"
description = "hgp-lib: Hierarchical Genetic Programming Library for Generating Boolean Rules from Tabular Data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ramona-Georgiana Albert", email = "ramona-georgiana.albert@info.uaic.ro"},
    { name = "George Stoica", email = "george.stoica@info.uaic.ro"},
]
maintainers = [
    { name = "George Stoica", email = "george.stoica@info.uaic.ro"},
    { name = "Ramona-Georgiana Albert", email = "ramona-georgiana.albert@info.uaic.ro"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
keywords = [
    "explainable ai",
    "xai",
    "interpretable machine learning",
    "rule-based classification",
    "boolean rules",
    "genetic programming",
    "hierarchical genetic programming",
    "evolutionary computation",
    "glass-box model",
    "binary classification",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
]
[tool.setuptools.packages.find]
include = ["hgp_lib*"]

[project.urls]
Repository = "https://github.com/fii-optim-lab/hgp-lib"
Issues = "https://github.com/fii-optim-lab/hgp-lib/issues"


[project.optional-dependencies]
dev = [
    "mkdocs",
    "mkdocstrings-python",
    "mkdocs-material",
    "mkdocs-bibtex",
    "pytest",
    "flake8",
    "ruff",
    "seaborn",
    "tables",
    "prettytable",
    "timed-decorator",
    "pytest-cov",
    "optuna",
    "optuna-dashboard",
    "matplotlib",
]
[tool.ruff]
exclude = [".venv"]

[tool.coverage.run]
source = ["hgp_lib"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
# Exclude non-testable lines from the denominator
exclude_also = [
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
# Collect unit tests from tests/ and doctests from the package modules.
# testpaths is scoped so --doctest-modules never imports scripts/, test.py, etc.
testpaths = ["tests", "hgp_lib"]
addopts = "--doctest-modules"
