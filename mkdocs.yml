site_name: HGP Library
site_description: Explainable rule-based classification via hierarchical genetic programming
repo_url: https://github.com/fii-optim-lab/hgp-lib

theme:
  name: material
  palette:
    scheme: default
    primary: teal
  features:
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - bibtex:
      bib_file: docs/references.bib
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Background:
    - Theory: theory.md
    - Interpretability: interpretability.md
  - User Guide:
    - Data Preparation: guide/data-preparation.md
    - Binarization: guide/binarization.md
    - Training: guide/training.md
    - Benchmarking: guide/benchmarking.md
    - Configuring HGP: guide/configuring.md
    - Extending HGP: guide/extending.md
    - Rule Trees: guide/rule-trees.md
  - Experiments:
    - experiments/index.md
    - PMLB: experiments/pmlb.md
    - PaySim: experiments/paysim.md
    - AEAC: experiments/aeac.md
  - API Reference:
    - api/index.md
    - Algorithms: api/algorithms.md
    - Configs: api/configs.md
    - Trainers: api/trainers.md
    - Benchmarkers: api/benchmarkers.md
    - Rules: api/rules.md
    - Mutations: api/mutations.md
    - Crossover: api/crossover.md
    - Selections: api/selections.md
    - Populations: api/populations.md
    - Preprocessing: api/preprocessing.md
    - Metrics: api/metrics.md
    - Utils: api/utils.md
