# Lightweight cross-version check: installs the package with `pip install .[dev]`
# and runs the test suite plus Ruff lint/format checks on every supported Python
# version. Kept intentionally light (no coverage measurement or Codecov upload) so
# it stays fast across the matrix; the coverage job lives in python-package.yml.

name: Test matrix

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[dev]
    - name: Test with pytest
      run: |
        pytest
    - name: Lint with Ruff
      run: ruff check
    - name: Check formatting with Ruff
      run: ruff format --diff --check
