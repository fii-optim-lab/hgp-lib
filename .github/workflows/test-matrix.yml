# Lightweight cross-version check: installs the package with `pip install .[dev]`
# and runs the test suite plus Ruff lint/format checks on every supported Python
# version. Kept intentionally light (no coverage measurement or Codecov upload) so
# it stays fast across the matrix; the coverage job lives in python-package.yml.

name: Test matrix

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[dev]
    - name: Test with pytest
      # Run from outside the checkout so the source `hgp_lib/` cannot shadow the
      # installed package. Doctests are collected from the installed package via
      # `--pyargs hgp_lib`, and the unit tests from the repo's `tests/` directory.
      # This tests the actually-installed artifact and avoids the "import file
      # mismatch" without `--import-mode=importlib`. Keeping the default (prepend)
      # import mode is also what lets multiprocessing workers re-import test modules
      # under Python 3.14's forkserver start method, which would otherwise hang.
      working-directory: ${{ runner.temp }}
      run: pytest --pyargs hgp_lib "${{ github.workspace }}/tests"
    - name: Lint with Ruff
      working-directory: ${{ github.workspace }}
      run: ruff check
    - name: Check formatting with Ruff
      working-directory: ${{ github.workspace }}
      run: ruff format --diff --check
